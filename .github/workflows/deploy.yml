# Deploy to Vercel on every push to main.
#
# This exists because linking the Vercel project directly to the GitHub repo
# needs a GitHub Login Connection on the Vercel account, which is a dashboard
# setting. If you add that connection, Vercel deploys on push by itself and this
# workflow becomes redundant — delete it then.
#
# Until then this does the same job with one repository secret:
#
#   1. Create a token at https://vercel.com/account/settings/tokens
#   2. Add it as a repository secret named VERCEL_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# The org and project IDs below are identifiers, not credentials — they are the
# same values Vercel writes into .vercel/project.json.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_LTGnxGMhuJ8WnC0mkBbTkIde
  VERCEL_PROJECT_ID: prj_mNKGh3Ptnc1PsZ0SoSXsZfAQpvww

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token is present
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            echo "::error::Create the token at https://vercel.com/account/settings/tokens"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      # the coordinate and query-parsing tests are pure node and cost seconds;
      # a deploy that ships broken maths is worse than a deploy that does not happen
      - name: Test
        run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # builds locally on the runner, which runs scripts/vendor.mjs and produces
      # the /vendor tree the import maps point at
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $url"
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "$url" >> $GITHUB_STEP_SUMMARY
